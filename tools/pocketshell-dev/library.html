<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PocketShell Library · PocketJS</title><style>
:root{color-scheme:dark;background:#090e14;color:#e8edf2;font:15px system-ui,sans-serif}body{margin:0;display:grid;place-items:center;min-height:100vh}.device{width:720px;height:480px;overflow:hidden;position:relative;background:#0b1118;border:1px solid #44505c}.screen{padding:24px;height:432px;display:flex;flex-direction:column;gap:8px}.header,.footer{height:36px;display:flex;justify-content:space-between;align-items:center}.rows{overflow:hidden;flex:1}.row{height:30px;padding:4px 8px;box-sizing:border-box}.row.selected{background:#354350}.reading{white-space:pre-wrap;overflow:hidden;flex:1;font:16px/1.35 ui-monospace,monospace}.hint{font-size:12px;color:#a7b2bc}.search{width:260px;background:#111b24;color:#fff;border:1px solid #67ddbd;padding:6px}button{background:#18232d;color:#e8edf2;border:1px solid #45515d;padding:6px 12px;margin:3px}.controls{width:720px;margin:10px auto;text-align:center}.controls input{display:none}
</style></head><body><main><section class="device" id="device"><div class="screen"><header class="header"><strong id="title">Library Workspace</strong><span id="status">POCKETSHELL · 720×480</span></header><div id="content" class="rows"></div><footer class="footer"><span id="notice"></span><span class="hint">↑↓ Select · A Open · B Back · X Favorite · Y Search · START Settings</span></footer></div></section><section class="controls" aria-label="Controller"><div><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowLeft">←</button><button data-key="ArrowRight">→</button><button data-key="Enter">A</button><button data-key="Escape">B</button><button data-key="x">X</button><button data-key="y">Y</button><button data-key=" ">START</button></div><input id="searchInput" class="search" aria-label="Search"></section><pre id="log"></pre>
<script type="module" src="/library-harness.js"></script></main></body></html>
