[package]
name = "pocketshell-dev"
version = "0.1.0"
edition = "2021"
description = "PocketShell Developer Host: browser harness for the ROCKNIX terminal frontend"
publish = false

[[bin]]
name = "pocketshell-dev"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
libc = "0.2"
[dev-dependencies]
base64 = "0.22"
serde = "1"
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
