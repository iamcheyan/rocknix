[package]
name = "pocketshell-dev"
version = "0.1.0"
edition = "2021"
description = "PocketShell Developer Host: browser harness for the ROCKNIX terminal frontend"
publish = false

[[bin]]
name = "pocketshell-dev"
path = "src/main.rs"

[dependencies]
ed25519-compact = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tar = "0.4"
