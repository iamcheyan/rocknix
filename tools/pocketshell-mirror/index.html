<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG34XX 实时画面</title>
<style>body{margin:0;background:#080d16;color:#d8e6e9;font:15px system-ui;text-align:center}main{max-width:800px;margin:28px auto;padding:16px}h1{font-size:22px}img{width:100%;max-width:720px;aspect-ratio:3/2;background:black;border:1px solid #304351;image-rendering:auto}button{background:#172939;color:#d8e6e9;border:1px solid #395264;border-radius:8px;padding:14px 20px;font:inherit;touch-action:manipulation;cursor:pointer}button:active{background:#27645b}.controls{display:flex;gap:18px;justify-content:space-around;flex-wrap:wrap;margin:20px}.pad{display:grid;grid-template-columns:repeat(3,60px);gap:6px}.row{display:flex;gap:8px;justify-content:center;margin:8px}small{color:#8aa2af}#status{height:24px;color:#78dbc4}</style>
<main><h1>RG34XX 实时画面</h1><p id="status">连接中…</p><img id="screen" alt="掌机 LCD 当前画面"><div class="controls"><div class="pad"><span></span><button data-key="UP">↑</button><span></span><button data-key="LEFT">←</button><button data-key="DOWN">↓</button><button data-key="RIGHT">→</button></div><div><div class="row"><button data-key="X">X</button><button data-key="Y">Y</button></div><div class="row"><button data-key="B">B</button><button data-key="A">A</button></div></div></div><div class="row"><button data-key="L">L</button><button data-key="R">R</button><button data-key="L1">L1</button><button data-key="R1">R1</button></div><div class="row"><button data-key="SELECT">SELECT</button><button data-key="START">START</button></div><small>实时读取 LCD 的 DRM 输出 · 720×480 · 约 2 FPS<br>方向键控制；Q/E = L/R，Enter = A，Esc = B，空格 = START</small></main>
<script>const screen=document.getElementById('screen'),status=document.getElementById('status');async function refresh(){try{const s=await(await fetch('/status')).json();if(s.error)throw Error(s.error);await new Promise((resolve,reject)=>{screen.onload=resolve;screen.onerror=reject;screen.src='/frame.jpg?t='+Date.now()});status.textContent='● 实时连接 · 帧 '+s.sequence}catch(e){status.textContent='连接中断 · 正在重试'}setTimeout(refresh,300)}async function key(k){try{const r=await fetch('/key/'+k,{method:'POST'});if(!r.ok)throw Error(await r.text())}catch(e){status.textContent='输入失败：'+e.message}}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));document.addEventListener('keydown',e=>{const k={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',Enter:'A',Escape:'B',q:'L',e:'R',' ':'START',x:'X',y:'Y'}[e.key];if(k&&!e.repeat){e.preventDefault();key(k)}});refresh();</script></html>
